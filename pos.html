<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>伯虎收銀</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f6f1e9;--card:#fffdf9;--ink:#2b2622;--mute:#8a7f74;--line:#e6ddd0;--accent:#b5562e;--accent-ink:#fff;--ok:#4f7a4a;--warn:#b3362b;--chip:#efe6d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:17px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.04em}
header .sub{color:var(--mute);font-size:14px}
nav{margin-left:auto;display:flex;gap:6px}
nav button{padding:8px 18px;border-radius:999px;color:var(--mute)}
nav button.on{background:var(--ink);color:var(--card)}
main{height:calc(100% - 61px)}
.view{display:none;height:100%}
.view.on{display:flex}
/* 收銀 */
#v-pos{gap:0}
.menu{flex:1;display:flex;flex-direction:column;min-width:0}
.cats{display:flex;gap:8px;padding:14px 20px 4px;overflow-x:auto}
.cats button{padding:8px 16px;border-radius:999px;background:var(--chip);white-space:nowrap}
.cats button.on{background:var(--accent);color:var(--accent-ink)}
.grid{flex:1;overflow-y:auto;padding:14px 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.item:active{transform:scale(.97)}
.item .n{font-weight:600;line-height:1.3}
.item .p{color:var(--accent);margin-top:8px}
.item.nop .p{color:var(--warn);font-size:14px}
.cart{width:380px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.cart-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.cart-h select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)}
.lines{flex:1;overflow-y:auto;padding:6px 18px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{flex:1;line-height:1.3}
.line .nm small{display:block;color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:20px;line-height:1}
.qty span{min-width:22px;text-align:center}
.line .amt{width:64px;text-align:right}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.sum{padding:12px 18px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.row input{width:110px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.total{font-size:28px;font-weight:700}
.pays{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pays button{flex:1 0 auto;padding:9px 10px;border-radius:10px;background:var(--chip)}
.pays button.on{background:var(--ink);color:var(--card)}
.quick{display:flex;gap:6px;margin-top:6px}
.quick button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line)}
.change{color:var(--ok);font-weight:600}
.go{display:flex;gap:8px;margin-top:12px}
.go button{flex:1;padding:16px 0;border-radius:12px;font-weight:600}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-sub{background:var(--chip)}
.go button:disabled{opacity:.35}
/* 今日 / 設定 */
.page{flex:1;overflow-y:auto;padding:20px;max-width:980px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
.bar button,.pill{padding:8px 16px;border-radius:999px;background:var(--chip)}
.bar .btn-main{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat span{color:var(--mute);font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:18px}
.box h3{font-size:15px;color:var(--mute);font-weight:500;margin:12px 0 4px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:14px}
td.r,th.r{text-align:right}
tr.void td{color:var(--mute);text-decoration:line-through}
tr.void td.act{text-decoration:none}
td.act button{padding:4px 10px;border-radius:8px;background:var(--chip);margin-left:4px;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.field label{color:var(--mute);font-size:14px}
.field input,.field textarea,.field select,.ptab input,.ptab select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%}
.field textarea{min-height:64px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;margin:12px 0}
.ptab td{padding:6px 4px}
.ptab .del{color:var(--warn);padding:6px 8px}
.hint{color:var(--mute);font-size:14px;line-height:1.6}
.danger{color:var(--warn)}
.sync{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--mute);white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.bad{color:var(--warn)}
a.sync{text-decoration:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:12px 22px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--warn)}
@media (max-width:820px){#v-pos{flex-direction:column}.cart{width:auto;border-left:0;border-top:1px solid var(--line);max-height:55%}header .sub{display:none}}
</style>
</head>
<body>
<header>
  <h1 id="h-store">伯虎在二樓</h1>
  <span class="sub" id="h-sub"></span>
  <a class="sync" id="h-sync" href="./">連線中…</a>
  <nav>
    <button data-tab="pos" class="on">收銀</button>
    <button data-tab="day">今日</button>
    <button data-tab="set">設定</button>
  </nav>
</header>
<main>
  <section class="view on" id="v-pos">
    <div class="menu">
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="cart">
      <div class="cart-h">
        <b>本單</b>
        <label>收銀 <select id="cashier"></select></label>
      </div>
      <div class="lines" id="lines"></div>
      <div class="sum">
        <div class="row"><span>小計</span><span id="subtotal">$0</span></div>
        <div class="row"><span>折扣</span><input id="discount" type="number" inputmode="numeric" min="0" placeholder="0"></div>
        <div class="row"><span>應收</span><span class="total" id="total">$0</span></div>
        <div class="pays" id="pays"></div>
        <div id="cashbox">
          <div class="row"><span>收現</span><input id="received" type="number" inputmode="numeric" min="0" placeholder="0"></div>
          <div class="quick" id="quick"></div>
          <div class="row"><span>找零</span><span class="change" id="change">$0</span></div>
        </div>
        <div class="go">
          <button class="btn-sub" id="btn-clear">清空</button>
          <button class="btn-sub" id="btn-noprint">結帳不出單</button>
          <button class="btn-main" id="btn-checkout" style="flex:1.6">結帳出單</button>
        </div>
      </div>
    </aside>
  </section>

  <section class="view" id="v-day">
    <div class="page">
      <div class="bar">
        <input type="date" id="day-date">
        <button class="btn-main" id="btn-close">列印日結單</button>
        <button id="btn-csv">匯出 CSV</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="box"><h3>品項</h3><table id="t-items"></table></div>
      <div class="box"><h3>付款方式</h3><table id="t-pays"></table></div>
      <div class="box"><h3>訂單</h3><table id="t-orders"></table></div>
    </div>
  </section>

  <section class="view" id="v-set">
    <div class="page">
      <div class="box">
        <h3>店舖與明細單</h3>
        <div class="field"><label>店名（明細單抬頭）</label><input data-s="store"></div>
        <div class="field"><label>這台收銀機屬於哪個櫃位（結帳會即時傳到帳本的這個櫃位）</label><select id="branchSel"></select></div>
        <div class="field"><label>抬頭下方小字（地址、IG 等，可多行）</label><textarea data-s="header"></textarea></div>
        <div class="field"><label>明細單結尾的話（可多行）</label><textarea data-s="footer"></textarea></div>
        <div class="field"><label>收銀人員（沒登入帳本時才用，用逗號分開；登入後自動用登入者的名字）</label><input data-s="cashiers"></div>
        <div class="field"><label>付款方式（用逗號分開，第一個是現金）</label><input data-s="pays"></div>
      </div>
      <div class="box">
        <h3>出單機</h3>
        <div class="field"><label>列印寬度</label>
          <select data-s="width"><option value="576">80mm 紙（576 點）</option><option value="406">58mm 紙（406 點）</option></select>
        </div>
        <label class="check"><input type="checkbox" data-s="drawer"> 現金結帳後彈開錢櫃（出單機有接錢櫃才勾）</label>
        <div class="bar"><button class="btn-main" id="btn-test">測試列印</button></div>
        <p class="hint">第一次使用：iPad 安裝 App Store 上的「Star PassPRNT」，打開它選好 TSP100III，再回這頁按測試列印。Safari 問「要在 PassPRNT 中打開嗎」時選打開。</p>
      </div>
      <div class="box">
        <h3>品項與價格</h3>
        <table class="ptab" id="t-products"></table>
        <div class="bar" style="margin-top:12px"><button id="btn-add">＋ 新增品項</button></div>
      </div>
      <div class="box">
        <h3>資料</h3>
        <p class="hint" id="syncHint">每一筆結帳都會即時傳到伯虎帳本，老闆在帳本首頁的「櫃位即時營業」就看得到。網路斷掉時照樣可以結帳出單，訂單會先存在這台 iPad，網路恢復後自動補傳。</p>
        <div class="bar"><button class="danger" id="btn-wipe">清除全部訂單</button></div>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>
