<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>伯虎活動收銀</title>
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#24414a">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="活動收銀">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* 活動收銀：巡迴麵包車、市集用的行動計算機。上方選活動，下方「收銀／紀錄／品項」三個分頁 */
:root{
  --bg:#f3f4f1; --paper:#fcfcfa; --ink:#1b211e; --ink-2:#4f5a54; --ink-3:#86908a;
  --rule:#dde1dc; --soft:#ebeee9; --hover:#f0f2ee;
  --jade:#1f5e4a; --jade-soft:#e3efe9;
  --amber:#b8651a; --amber-soft:#fbf0e3; --amber-ink:#7a3f0c;
  --pos:#1f7a4d; --neg:#c23a3a; --focus:#2a78d6;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--jade);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.15;margin:0;letter-spacing:.02em}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.back{font-size:13px;color:var(--jade);text-decoration:none}
.who-n{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.who-n i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-size:12px}
.linkbtn{border:0;background:none;color:var(--jade);cursor:pointer;font-size:13px;text-decoration:underline;padding:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--paper);padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--paper);font-weight:700}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:12.5px;color:var(--ink-3)}
.notice{background:var(--paper);border:1px dashed var(--rule);border-radius:12px;padding:18px;color:var(--ink-2);font-size:14px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:var(--jade-soft);font-weight:700}

/* 活動列 */
.evbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evbar select{flex:1;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 10px;font-weight:700}
.evstat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.evstat b{color:var(--ink);font-size:15px}

/* 收銀 */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.cat-h{font-size:12px;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:2px 0 -4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.pbtn{position:relative;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:12px 8px;cursor:pointer;display:grid;gap:2px;text-align:center;min-height:72px;align-content:center;touch-action:manipulation}
.pbtn:active{background:var(--jade-soft)}
.pbtn b{font-size:15px;line-height:1.3}
.pbtn span{font-size:13px;color:var(--ink-2)}
.pbtn em{position:absolute;top:-6px;right:-6px;font-style:normal;background:var(--jade);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.pbtn.custom{border-style:dashed;color:var(--ink-2)}
.cart{position:sticky;top:10px;display:grid;gap:10px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:14px;border-bottom:1px solid var(--soft);padding-bottom:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.qty button{border:0;background:var(--paper);width:30px;height:28px;cursor:pointer;font-size:16px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-family:var(--f-display);font-size:34px;font-weight:900;line-height:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.change{background:var(--amber-soft);color:var(--amber-ink);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline}
.change b{font-size:24px;font-family:var(--f-display)}
.change.bad{background:#fbe9e9;color:var(--neg)}
.big-btn{width:100%;padding:13px;font-size:17px;border-radius:12px}

/* 紀錄 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.kpi span{display:block;font-size:12px;color:var(--ink-3)}
.kpi b{font-size:22px;font-family:var(--f-display)}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--rule);padding:6px}
table.list td{border-bottom:1px solid var(--soft);padding:7px 6px;vertical-align:top}
table.list .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.void td{color:var(--ink-3);text-decoration:line-through}
tr.void td:last-child{text-decoration:none}
.tbl{overflow-x:auto}
.mini{font-size:12px;color:var(--ink-3)}
.pay-tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--ink-2);font-weight:700;white-space:nowrap}

/* 品項 */
.mrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.mrow input{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:7px 8px;width:100%;min-width:0}

/* Modal / 登入 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,11,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--paper);border-radius:14px;width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lg{display:grid;gap:12px;justify-items:center;text-align:center}
.lg form{display:grid;gap:10px;width:min(300px,100%)}
.lg input{font-size:18px;letter-spacing:.1em;text-align:center;border:1px solid var(--rule);border-radius:12px;padding:10px;background:var(--bg)}
.lg-err{color:var(--neg);font-size:13px;margin:0;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:50;white-space:nowrap}
.cartbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);border:0;border-radius:14px;padding:12px 16px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer;font-size:15px}
.cartbar b{font-size:20px;font-family:var(--f-display)}
.off{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);border-radius:999px;padding:2px 10px}

@media (max-width:760px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .cart{position:static}
  .cartbar{display:flex}
  body.has-cart{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mrow{grid-template-columns:minmax(0,1fr) 76px auto;}
  .mrow .mcat{grid-column:1/3}
}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">伯虎在二樓・巡迴麵包車／市集</div>
      <h1>活動收銀</h1>
    </div>
    <div class="top-r"><span class="off" id="offline" hidden>離線中・恢復網路後自動上傳</span><a class="back" href="./">← 營運管理</a><span id="who"></span></div>
  </header>
  <div id="bar"></div>
  <main id="main" style="display:grid;gap:14px"></main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
