<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山食訂貨單</title>
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#24414a">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="山食訂貨">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* 合作廠商共用訂貨單：伯虎新竹巨城櫃位 × 山食（法國棍麵包）。拿到專屬連結的人都能看、能填 */
:root{
  --bg:#f3f4f1; --paper:#fcfcfa; --ink:#1b211e; --ink-2:#4f5a54; --ink-3:#86908a;
  --rule:#dde1dc; --soft:#ebeee9; --hover:#f0f2ee;
  --jade:#1f5e4a; --jade-soft:#e3efe9;
  --amber:#b8651a; --amber-soft:#fbf0e3; --amber-ink:#7a3f0c;
  --pos:#1f7a4d; --neg:#c23a3a; --focus:#2a78d6;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:14px}
.num{font-variant-numeric:tabular-nums}
header{display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--jade);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;letter-spacing:.02em}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
.hint{font-size:12.5px;color:var(--ink-3)}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.notice{background:var(--paper);border:1px dashed var(--rule);border-radius:12px;padding:18px;color:var(--ink-2);font-size:14px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;touch-action:manipulation}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--paper);font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--paper);padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.whobar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.rule-t{white-space:pre-wrap;font-size:14px;color:var(--ink-2);margin:0}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{font-family:var(--f-display);font-size:20px;min-width:118px;text-align:center}
.mnav button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--ink-3)}
.kpi b{font-size:22px;font-family:var(--f-display)}
.kpi.warn b{color:var(--amber)}
/* 日期列 */
.days{display:grid;gap:0}
.drow{display:grid;grid-template-columns:76px minmax(0,1fr) 96px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--soft)}
.drow:last-child{border-bottom:0}
.drow.past{opacity:.62}
.drow.today{background:var(--jade-soft);border-radius:10px;opacity:1}
.drow.wk0 .dd i{color:var(--neg)}
.dd{display:grid;line-height:1.2}
.dd b{font-size:16px;font-variant-numeric:tabular-nums}
.dd i{font-style:normal;font-size:12px;color:var(--ink-3)}
.lines{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-width:0}
.ln{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--paper)}
.qty button{border:0;background:var(--paper);width:32px;height:30px;cursor:pointer;font-size:17px;touch-action:manipulation}
.qty input{width:40px;border:0;text-align:center;background:transparent;font-variant-numeric:tabular-nums;font-weight:700;padding:0;-moz-appearance:textfield}
.qty input::placeholder{color:var(--ink-3);font-weight:400;opacity:.6}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rcv{font-size:12px;color:var(--pos)}
.rcv.diff{color:var(--neg)}
.dnote{flex-basis:100%;font-size:12.5px;color:var(--ink-3)}
.st{border:0;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;justify-self:end;white-space:nowrap}
.st.s-none{background:transparent;color:var(--ink-3);font-weight:500;border:1px dashed var(--rule)}
.st.s-wait{background:var(--amber-soft);color:var(--amber-ink)}
.st.s-ok{background:var(--jade-soft);color:var(--jade)}
.st.s-got{background:var(--jade);color:#fff}
.st.s-cancel{background:var(--soft);color:var(--ink-3);text-decoration:line-through}
/* 表單 */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:6px;align-items:center}
.irow input{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:7px 8px;width:100%;min-width:0}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--rule);padding:6px}
table.list td{border-bottom:1px solid var(--soft);padding:7px 6px}
table.list .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.list tfoot td{font-weight:700;border-bottom:0}
.tbl{overflow-x:auto}
.log{font-size:12.5px;color:var(--ink-3);display:grid;gap:2px;max-height:140px;overflow:auto}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,11,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--paper);border-radius:14px;width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.who-pick{display:grid;gap:10px}
.who-pick .big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-pick .big button{border:1px solid var(--rule);background:var(--bg);border-radius:12px;padding:18px 10px;cursor:pointer;font-size:16px;font-weight:700}
.who-pick .big button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:50;white-space:nowrap}
.off{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);border-radius:999px;padding:2px 10px}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drow{grid-template-columns:56px minmax(0,1fr) auto;gap:8px}
}
@media print{
  body{background:#fff;padding:0}
  .noprint,.qty button{display:none!important}
  .panel{border:0;padding:0}
}
</style>
</head>

  <header>

  <div class="whobar noprint" id="whobar"></div>

</div>
