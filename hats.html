<style>
body{margin:0}[hidden]{display:none!important}
/* 工作帽登記：恆春夥伴一人選一頂，選了就由自己保管 */
:root{
  --bg:#f3f1ec; --paper:#fcfbf8; --ink:#1f1c19; --ink-2:#55504a; --ink-3:#8d867d;
  --rule:#e0dbd2; --soft:#eeeae2; --jade:#1f4d43; --jade-soft:#e2ede8; --neg:#b33a3a; --focus:#2a78d6;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--jade);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,6vw,34px);line-height:1.15;margin:0}
.who{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.linkbtn{border:0;background:none;color:var(--jade);text-decoration:underline;cursor:pointer;padding:0}
a.back{color:var(--jade);text-decoration:none;font-size:13px}
.rule{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.rule p{margin:0;color:var(--ink-2)}
.ack{display:flex;gap:10px;align-items:flex-start;font-weight:700;cursor:pointer}
.ack input{width:20px;height:20px;margin-top:2px;accent-color:var(--jade)}
.seg{display:inline-flex;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px;justify-self:start}.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;cursor:pointer;color:var(--ink-2)}.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hat{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.hat.mine{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade)}
.ph{position:relative;aspect-ratio:3/4;background:var(--soft);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block}
.no{position:absolute;left:10px;top:10px;background:#24302c;color:#f6eede;font-family:var(--f-display);font-weight:700;font-size:20px;padding:2px 12px;border-radius:10px}
.bd{padding:10px 12px 12px;display:grid;gap:8px;align-content:start}
.st{font-size:14px;color:var(--ink-3)}
.st b{color:var(--ink)}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;touch-action:manipulation;width:100%}
.btn.pri{background:var(--jade);border-color:var(--jade);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{font-weight:500;color:var(--neg)}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.list h2{font-family:var(--f-display);font-size:17px;margin:0 0 4px}
.list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--rule);padding:4px 0;font-size:14px}
.notice{background:var(--paper);border:1px dashed var(--rule);border-radius:14px;padding:18px;color:var(--ink-2)}
.modal{position:fixed;inset:0;background:rgba(10,10,10,.5);display:grid;place-items:center;padding:16px;z-index:30}
.mbox{background:var(--paper);border-radius:14px;width:min(400px,100%);padding:20px;display:grid;gap:12px}
.mbox h2{font-family:var(--f-display);margin:0;font-size:19px}
.mbox input{border:1px solid var(--rule);border-radius:10px;padding:10px;width:100%;background:var(--bg)}
.err{color:var(--neg);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:40}
@media (min-width:760px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
</style>
