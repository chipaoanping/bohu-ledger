<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>伯虎飲品SOP手冊</title>
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#24414a">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="伯虎飲品">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: 與收支總覽同一套紙面、墨綠； 上方切換「上桌速查／吧台SOP／考核／人員」，下方是依菜單分類排列的品項清單 */
:root{
  --bg:#f3f4f1; --paper:#fcfcfa; --ink:#1b211e; --ink-2:#4f5a54; --ink-3:#86908a;
  --rule:#dde1dc; --soft:#ebeee9; --hover:#f0f2ee;
  --jade:#1f5e4a; --jade-soft:#e3efe9;
  --amber:#b8651a; --amber-soft:#fbf0e3; --amber-ink:#7a3f0c;
  --pos:#1f7a4d; --neg:#c23a3a; --focus:#2a78d6;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--jade);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0}
.who{font-size:13px;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.role{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--jade-soft);color:var(--jade);font-weight:700}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--paper);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:var(--jade-soft);font-weight:700}
.search{flex:1;min-width:160px;max-width:280px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 14px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--paper);font-weight:700}
.btn.danger{color:var(--neg)}
.hint{font-size:13px;color:var(--ink-3)}
.notice{background:var(--paper);border:1px dashed var(--rule);border-radius:12px;padding:18px;color:var(--ink-2);font-size:14px}

.cat{display:grid;gap:10px}
.cat-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.cat-h small{color:var(--ink-3);font-size:12px;letter-spacing:.1em}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.item{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.item-top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item-name{font-weight:700;font-size:16px}
.item-en{font-size:12.5px;color:var(--ink-3)}
.price{font-weight:700;color:var(--ink-2);white-space:nowrap}
.tags{display:flex;gap:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--ink-2);font-weight:700}
.desc{font-size:13.5px;color:var(--ink-2)}
.tip{background:var(--amber-soft);color:var(--amber-ink);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.55}
.tip b{display:block;font-size:11px;letter-spacing:.12em;color:var(--amber);margin-bottom:1px}
.tip.empty{background:var(--soft);color:var(--ink-3)}

/* SOP */
.sop{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.sop summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center}
.sop summary::-webkit-details-marker{display:none}
.sop summary .item-name{flex:1;min-width:0}
.sop[open] summary{border-bottom:1px solid var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex:none}
.dot.ok{background:var(--jade)}
.sop-body{padding:14px 16px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fact{background:var(--soft);border-radius:8px;padding:8px 10px}
.fact span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.fact b{font-weight:500}
.ing{width:100%;border-collapse:collapse;font-size:14px}
.ing td{border-bottom:1px solid var(--soft);padding:6px 4px}
.ing td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.steps{margin:0;padding-left:22px;display:grid;gap:4px}
.lbl{font-size:12px;color:var(--ink-3);letter-spacing:.1em;font-weight:700;margin-bottom:4px}

/* Quiz */
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:14px}
.q-prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--jade)}
.q-text{font-size:17px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt.right{border-color:var(--pos);background:var(--jade-soft)}
.opt.wrong{border-color:var(--neg)}
.big{font-family:var(--f-display);font-size:44px;font-weight:900;line-height:1}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--rule);padding:6px}
table.list td{border-bottom:1px solid var(--soft);padding:8px 6px}
.tbl{overflow-x:auto}

/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,11,.5);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--paper);border-radius:14px;width:min(620px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.form textarea{min-height:76px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.mfoot .sp{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:50}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who-n{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.who-n i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-size:13px}
a.back{font-size:13px;color:var(--jade);text-decoration:none}
.lg{display:grid;gap:12px;justify-items:center;text-align:center}
.lg-names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lg-names button{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px}
.lg form{display:grid;gap:10px;width:min(300px,100%)}
.lg input{font-size:18px;letter-spacing:.15em;text-align:center;border:1px solid var(--rule);border-radius:12px;padding:10px;background:var(--bg)}
.lg-err{color:var(--neg);font-size:13px;margin:0;min-height:1em}
.linkbtn{border:0;background:none;color:var(--jade);cursor:pointer;font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">伯虎在二樓・飲品</div>
      <h1>飲品 SOP 手冊</h1>
    </div>
    <div class="top-r"><a class="back" href="./">← 收支總覽</a><span class="who" id="who"></span></div>
  </header>

  <div class="ctl">
    <div class="seg" role="group" aria-label="頁面" id="tabs">
      <button data-v="serve">上桌速查</button>
      <button data-v="sop" hidden>吧台SOP</button>
      <button data-v="quiz" hidden>考核</button>
      <button data-v="team" hidden>人員</button>
    </div>
  </div>

  <div class="ctl" id="filters">
    <div class="chips" id="cats"></div>
    <input class="search" id="q" type="search" placeholder="搜尋品名" aria-label="搜尋品名">
    <button class="btn pri" id="addBtn" hidden>＋ 新增品項</button>
  </div>

  <main id="main" style="display:grid;gap:22px"></main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* 伯虎在二樓 飲品SOP手冊：與收支總覽共用 Firebase 帳號
   權限：老闆（妃妃）＞ 吧台負責人（可編修）＞ 夥伴（看SOP、考核）＞ 外場（只看上桌速查）
   所有內容都要登入，而且要妃妃核准才看得到 */
const BOSS='妃妃';
const MAILDOM='bohu-ledger.app';
const CATS=[
  {k:'coffee',n:'Coffee',z:'咖啡'},
  {k:'sparkling',n:'Sparkling House Blend',z:'氣泡飲'},
  {k:'specialty',n:'Specialty Drink',z:'特調'},
  {k:'tea',n:'Tea Drink',z:'茶'},
  {k:'tipsy',n:'Tipsy Drink',z:'微醺'}
];
const DEFAULT_TEAM=[{name:'土豆',role:'bar'},{name:'小不點',role:'partner'},{name:'李樂',role:'partner'},{name:'雅淳',role:'partner'}];
const ROLE_NAME={boss:'老闆',bar:'吧台負責人',partner:'夥伴',front:'外場',guest:'待核准'};
const S={pending:{},drinks:{},drinksLoaded:false,sop:{},cfg:null,staff:null,pwset:{},quizAll:{},quizMine:null,
  user:null,view:'serve',cat:'all',q:'',quiz:null};
let fs=null,auth=null,subs=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=x=>String(x||'').trim().toLowerCase();
const hexOf=s=>[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
const emailOf=(name,v)=>`s${hexOf(name)}${(v||1)>1?'-v'+v:''}@${MAILDOM}`;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2400)}

/* ---------- 人員與權限 ---------- */
const ledgerPeople=()=>(S.staff&&Array.isArray(S.staff.people))?S.staff.people:[];
const teamList=()=>(S.cfg&&Array.isArray(S.cfg.people))?S.cfg.people:[];
const ledgerOf=n=>ledgerPeople().find(p=>p.name===n);
/* 同一個名字在帳本有帳號就沿用同一組密碼 */
function mailsOf(n){const p=ledgerOf(n);const a=[emailOf(n,p?p.v:1)];if(p&&p.mail)a.push(lc(p.mail));return a}
function isBossMail(m){const st=S.staff||{};return !!m&&(m===lc(st.bossEmail)||m===lc(st.bossMail)||(st.bossEmails||[]).map(lc).includes(m))}
function nameOfMail(m){
  for(const p of [...ledgerPeople(),...teamList()]) if(mailsOf(p.name).includes(m)) return p.name;
  const x=/^s([0-9a-f]+)(?:-v\d+)?@/.exec(m||'');
  if(x&&m.endsWith('@'+MAILDOM)){ try{ return new TextDecoder().decode(new Uint8Array(x[1].match(/../g).map(h=>parseInt(h,16)))); }catch(e){} }
  return null;
}
function role(){
  const u=S.user; if(!u) return 'guest';
  const m=lc(u.email);
  if(isBossMail(m)) return 'boss';
  const c=S.cfg||{};
  if((c.barEmails||[]).includes(m)) return 'bar';
  if((c.partnerEmails||[]).includes(m)) return 'partner';
  if((c.frontEmails||[]).includes(m)) return 'front';
  return 'guest';
}
const canEditMenu=()=>['boss','bar'].includes(role());
const seesSop=()=>['boss','bar','partner'].includes(role());
const seesMenu=()=>role()!=='guest';

/* ---------- 列表 ---------- */
function sorted(){
  return Object.entries(S.drinks).map(([id,d])=>({id,...d}))
    .sort((a,b)=>CATS.findIndex(c=>c.k===a.cat)-CATS.findIndex(c=>c.k===b.cat)||(a.order??99)-(b.order??99));
}
function filtered(){
  const q=S.q.trim().toLowerCase();
  return sorted().filter(d=>(S.cat==='all'||d.cat===S.cat)&&(!q||(d.name+' '+(d.en||'')).toLowerCase().includes(q)));
}
const tempTag=t=>t?`<span class="tag">${t==='H/I'?'冷熱':t==='H'?'熱':'冰'}</span>`:'';

function renderServe(){
  if(!S.drinksLoaded) return `<div class="notice">讀取中…</div>`;
  if(!Object.keys(S.drinks).length) return `<div class="notice">還沒有品項。${canEditMenu()?'按上方「＋ 新增品項」建立。':'請吧台負責人建立品項。'}</div>`;
  const list=filtered();
  if(!list.length) return `<div class="notice">找不到符合的品項。</div>`;
  return CATS.map(c=>{
    const ds=list.filter(d=>d.cat===c.k); if(!ds.length) return '';
    return `<section class="cat"><div class="cat-h"><h2>${c.n}</h2><small>${c.z}</small></div><div class="items">${ds.map(d=>`
      <article class="item">
        <div class="item-top"><div style="min-width:0"><div class="item-name">${esc(d.name)}</div>${d.en?`<div class="item-en">${esc(d.en)}</div>`:''}</div>
          <div style="display:grid;justify-items:end;gap:3px"><span class="price num">$${esc(d.price)}</span><span class="tags">${tempTag(d.temp)}</span></div></div>
        ${d.desc?`<div class="desc">${esc(d.desc)}</div>`:''}
        <div class="tip ${d.tip?'':'empty'}"><b>上桌提醒</b>${d.tip?esc(d.tip):'尚未填寫'}</div>
        ${canEditMenu()?`<div><button class="btn" data-edit="${d.id}" style="padding:3px 10px;font-size:13px">編修</button></div>`:''}
      </article>`).join('')}</div></section>`;
  }).join('');
}

function lines(s){return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean)}
function hasSop(id){const s=S.sop[id];return !!(s&&(lines(s.ingredients).length||lines(s.steps).length))}
function renderSop(){
  const list=filtered();
  const done=sorted().filter(d=>hasSop(d.id)).length, all=Object.keys(S.drinks).length;
  const head=`<div class="hint">已建立 ${done} / ${all} 杯的做法${canEditMenu()?'，點開品項後按「編修」填寫':'，由吧台負責人維護'}</div>`;
  return head+CATS.map(c=>{
    const ds=list.filter(d=>d.cat===c.k); if(!ds.length) return '';
    return `<section class="cat"><div class="cat-h"><h2>${c.n}</h2><small>${c.z}</small></div><div style="display:grid;gap:8px">${ds.map(d=>{
      const s=S.sop[d.id]||{}; const ing=lines(s.ingredients), st=lines(s.steps);
      return `<details class="sop"><summary><i class="dot ${hasSop(d.id)?'ok':''}"></i><span class="item-name">${esc(d.name)}</span>${tempTag(d.temp)}<span class="price num">$${esc(d.price)}</span></summary>
        <div class="sop-body">
          ${hasSop(d.id)?'':'<div class="hint">這杯的做法還沒填。</div>'}
          <div class="facts">
            <div class="fact"><span>杯型</span><b>${esc(s.cup)||'—'}</b></div>
            <div class="fact"><span>冰量／溫度</span><b>${esc(s.ice)||'—'}</b></div>
            <div class="fact"><span>裝飾</span><b>${esc(s.garnish)||'—'}</b></div>
          </div>
          ${ing.length?`<div><div class="lbl">材料與份量</div><table class="ing">${ing.map(l=>{const [a,b]=l.split(/[｜|]/);return `<tr><td>${esc(a)}</td><td>${esc(b||'')}</td></tr>`}).join('')}</table></div>`:''}
          ${st.length?`<div><div class="lbl">步驟</div><ol class="steps">${st.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}
          ${s.note?`<div><div class="lbl">注意</div><div>${esc(s.note)}</div></div>`:''}
          <div class="tip ${d.tip?'':'empty'}"><b>上桌提醒</b>${d.tip?esc(d.tip):'尚未填寫'}</div>
          ${canEditMenu()?`<div><button class="btn" data-edit="${d.id}">編修</button></div>`:''}
        </div></details>`;}).join('')}</div></section>`;
  }).join('');
}

/* ---------- 考核 ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(){
  const ds=sorted(); const qs=[];
  const pick=(arr,n,ex)=>shuffle([...new Set(arr)].filter(x=>x!==ex)).slice(0,n);
  const withTip=ds.filter(d=>d.tip);
  const prices=ds.map(d=>String(d.price));
  const cups=Object.values(S.sop).map(x=>x.cup).filter(Boolean);
  for(const d of shuffle(ds)){
    const kinds=[]; const s=S.sop[d.id];
    if(d.tip&&withTip.length>=4) kinds.push('tip','which');
    if(new Set(prices).size>=4) kinds.push('price');
    if(s&&s.cup&&new Set(cups).size>=3) kinds.push('cup');
    if(!kinds.length) continue;
    const k=kinds[Math.floor(Math.random()*kinds.length)];
    if(k==='tip') qs.push({t:`「${d.name}」上桌時要提醒客人什麼？`,a:d.tip,o:shuffle([d.tip,...pick(withTip.map(x=>x.tip),3,d.tip)])});
    if(k==='which') qs.push({t:`哪一杯上桌要這樣提醒：「${d.tip}」`,a:d.name,o:shuffle([d.name,...pick(withTip.filter(x=>x.tip!==d.tip).map(x=>x.name),3,d.name)])});
    if(k==='price') qs.push({t:`「${d.name}」售價多少？`,a:'$'+d.price,o:shuffle(['$'+d.price,...pick(prices,3,String(d.price)).map(p=>'$'+p)])});
    if(k==='cup') qs.push({t:`「${d.name}」用哪一種杯子？`,a:s.cup,o:shuffle([s.cup,...pick(cups,3,s.cup)])});
    if(qs.length>=10) break;
  }
  return {qs,i:0,score:0,picked:null};
}
function renderQuiz(){
  const Q=S.quiz; let out='';
  if(!Q){
    const runs=(S.quizMine&&S.quizMine.runs)||[];
    out+=`<div class="panel"><div><h2>飲品考核</h2><div class="hint">每次隨機 10 題，題目來自上桌提醒、售價，以及吧台SOP裡填好的杯型。</div></div>
      <div><button class="btn pri" id="startQuiz">開始考核</button></div>
      ${runs.length?`<div><div class="lbl">我的紀錄</div><div class="tbl"><table class="list"><tr><th>日期</th><th>分數</th></tr>${runs.slice().reverse().slice(0,8).map(r=>`<tr><td class="num">${esc(r.at.slice(0,10))}</td><td class="num">${r.score} / ${r.total}</td></tr>`).join('')}</table></div></div>`:'<div class="hint">你還沒有考核紀錄。</div>'}
    </div>`;
  }else if(Q.i>=Q.qs.length){
    out+=`<div class="panel"><div class="lbl">本次成績</div><div class="big num">${Q.score} <span style="font-size:22px;color:var(--ink-3)">/ ${Q.qs.length}</span></div>
      <div class="hint">${Q.saved===false?'成績沒有存到，請確認網路後再考一次。':Q.saved?'成績已記錄。':'儲存中…'}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="startQuiz">再考一次</button><button class="btn" id="endQuiz">回到考核首頁</button></div></div>`;
  }else{
    const q=Q.qs[Q.i];
    out+=`<div class="panel"><div class="q-prog"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
      <div class="hint num">第 ${Q.i+1} / ${Q.qs.length} 題</div><div class="q-text">${esc(q.t)}</div>
      <div class="opts">${q.o.map((o,n)=>{let c='';if(Q.picked!=null){if(o===q.a)c='right';else if(n===Q.picked)c='wrong'}return `<button class="opt ${c}" data-opt="${n}" ${Q.picked!=null?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
      ${Q.picked!=null?`<div><button class="btn pri" id="nextQ">${Q.i+1<Q.qs.length?'下一題':'看成績'}</button></div>`:''}</div>`;
  }
  if(canEditMenu()){
    const rows=Object.values(S.quizAll).filter(r=>(r.runs||[]).length);
    out+=`<div class="panel"><div><h2>全員成績</h2><div class="hint">每位夥伴最近一次與最佳成績</div></div>
      ${rows.length?`<div class="tbl"><table class="list"><tr><th>夥伴</th><th>最近</th><th>最佳</th><th>次數</th></tr>${rows.map(r=>{const rs=r.runs;const last=rs[rs.length-1];
        return `<tr><td>${esc(r.name||'—')}</td><td class="num">${last.score}/${last.total}・${esc(last.at.slice(5,10))}</td><td class="num">${Math.max(...rs.map(x=>x.score))}</td><td class="num">${rs.length}</td></tr>`}).join('')}</table></div>`:'<div class="hint">還沒有人完成考核。</div>'}</div>`;
  }
  return out;
}
async function saveQuiz(Q){
  const runs=((S.quizMine&&S.quizMine.runs)||[]).slice(-29);
  runs.push({at:new Date().toISOString(),score:Q.score,total:Q.qs.length});
  try{await fs.doc('drinkquiz/'+S.user.uid).set({name:nameOfMail(lc(S.user.email))||'',runs});Q.saved=true}catch(e){Q.saved=false}
  render();
}

const roleOpts=r=>ROLES.map(([k,n])=>`<option value="${k}" ${(r||'partner')===k?'selected':''}>${n}</option>`).join('');

async function saveTeam(draft){
  const list=(draft||TEAM_DRAFT).map(p=>({name:p.name.trim(),role:['bar','partner','front'].includes(p.role)?p.role:'partner'})).filter(p=>p.name);
  const em=r=>list.filter(p=>p.role===r).flatMap(p=>mailsOf(p.name));
  const data={people:list,barEmails:em('bar'),partnerEmails:em('partner'),frontEmails:em('front'),updatedAt:new Date().toISOString()};
  try{await fs.doc('drinkcfg/roles').set(data);TEAM_DRAFT=null;toast('名單已儲存');return true}catch(e){toast('沒有存到：只有老闆可以改名單');return false}

async function approve(uid){
  const p=S.pending[uid]; if(!p) return;
  const r=$('#pr-'+uid).value;
  const base=(TEAM_DRAFT||teamList()).map(x=>({...x})).filter(x=>x.name!==p.name);
  base.push({name:p.name,role:r});
  if(await saveTeam(base)) fs.doc('drinkreq/'+uid).delete().catch(()=>{});
}

/* ---------- 登入（與收支總覽同一套帳號） ---------- */
const A={name:null,mode:'login',err:'',busy:false};
function openLogin(){A.name=null;A.err='';renderLogin();$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true;render()}
function renderLogin(){
  let body;
  if(!A.name){
    body=`<h2>請輸入你的名字</h2>
      <form id="nameForm" autocomplete="on"><input id="lgName" autocomplete="username" placeholder="例：土豆" maxlength="20" style="letter-spacing:.05em"><button class="btn pri" type="submit">下一步</button></form>
      <p class="hint" style="margin:0">跟收支總覽用同一個名字。第一次使用的人登入後，要等妃妃核准才看得到內容。</p>`;
  }else{
    const first=A.mode==='set';
    body=`<div class="who-n"><i>${esc(A.name.slice(0,1))}</i>${esc(A.name)}</div>
      <h2>${first?'第一次登入，請設定密碼':'請輸入密碼'}</h2>
      <form id="pwForm" autocomplete="on">
        <input type="text" name="username" value="${esc(A.name)}" autocomplete="username" hidden>
        <input type="password" id="pw1" autocomplete="${first?'new-password':'current-password'}" placeholder="${first?'設定密碼（至少 6 個字）':'密碼'}" maxlength="64">
        ${first?'<input type="password" id="pw2" autocomplete="new-password" placeholder="再輸入一次" maxlength="64">':''}
        <p class="lg-err" role="alert">${esc(A.err)}</p>
        <button class="btn pri" type="submit" ${A.busy?'disabled':''}>${first?'設定密碼並登入':'登入'}</button>
      </form>
      <button class="linkbtn" data-lgmode="${first?'login':'set'}">${first?'已經設定過密碼？直接登入':'第一次登入，設定密碼'}</button>
      ${ledgerOf(A.name)?'<p class="hint" style="margin:0">密碼和收支總覽一樣</p>':''}
      <button class="linkbtn" data-lgback="1">換人</button>`;
  }
  $('#mbox').innerHTML=`<div class="lg">${body}<button class="btn" id="cancelBtn">關閉</button></div>`;
  $('#cancelBtn').onclick=closeModal;
  const nf=$('#nameForm'); if(nf){ nf.onsubmit=e=>{e.preventDefault();const n=$('#lgName').value.trim();if(!n)return;A.name=n;A.mode=pwDone(n)?'login':'set';A.err='';renderLogin()}; setTimeout(()=>$('#lgName')&&$('#lgName').focus(),30); }
  const f=$('#pwForm'); if(f){ f.onsubmit=e=>{e.preventDefault();submitPw()}; setTimeout(()=>$('#pw1')&&$('#pw1').focus(),30); }
}
function pwDone(n){const p=ledgerOf(n);return !!(S.pwset&&S.pwset[n]===((p&&p.v)||1))}
const authMsg=e=>{const c=(e&&e.code)||'';
  if(c==='auth/too-many-requests') return '嘗試太多次，請過幾分鐘再試';
  if(c==='auth/network-request-failed') return '網路連線失敗，請檢查網路';
  if(c==='auth/email-already-in-use') return '這個名字已經設定過密碼了，請直接登入；忘記密碼請找妃妃重設';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return pwDone(A.name)?'密碼不對，忘記密碼請找妃妃重設':'密碼不對。第一次使用的話，請按下方「第一次登入，設定密碼」';
  return '登入失敗（'+(c||'未知錯誤')+'）';};
async function submitPw(){
  if(A.busy) return;
  const p1=$('#pw1').value, p2=$('#pw2')?$('#pw2').value:null;
  const fail=m=>{A.err=m;A.busy=false;renderLogin()};
  if(A.mode==='set'){ if(p1.length<6) return fail('密碼至少要 6 個字'); if(p1!==p2) return fail('兩次輸入的密碼不一樣'); }
  else if(!p1) return fail('請輸入密碼');
  A.busy=true; A.err=''; renderLogin();
  const tries=mailsOf(A.name);
  try{
    if(A.mode==='set'){
      await auth.createUserWithEmailAndPassword(tries[0],p1);
      const p=ledgerOf(A.name); fs.doc('public/pwset').set({[A.name]:(p&&p.v)||1},{merge:true}).catch(()=>{});
    }else{
      let last; for(const m of tries){ try{ await auth.signInWithEmailAndPassword(m,p1); last=null; break; }catch(e){ last=e; } }
      if(last) throw last;
    }
    A.busy=false; closeModal(); toast('已登入');
  }catch(e){ fail(authMsg(e)) }
}

const quizBusy=()=>S.view==='quiz'&&S.quiz&&S.quiz.i<S.quiz.qs.length;
const safeRender=()=>{ const a=document.activeElement; if(quizBusy()||!$('#modal').hidden||(a&&a.matches&&a.matches('#main input,#main select,#main textarea'))) return; render(); };

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.closest('#tabs')&&t.dataset.v){S.view=t.dataset.v;try{history.replaceState(null,'','#'+S.view)}catch(_){}render();return}
  if(t.dataset.cat){S.cat=t.dataset.cat;render();return}
  if(t.dataset.edit){openEditor(t.dataset.edit);return}
  if(t.id==='addBtn'){openEditor(null);return}
  if(t.id==='loginBtn'||t.id==='loginBtn2'){openLogin();return}

  if(t.dataset.lgname){A.name=t.dataset.lgname;A.mode=pwDone(A.name)?'login':'set';A.err='';renderLogin();return}
  if(t.dataset.lgmode){A.mode=t.dataset.lgmode;A.err='';renderLogin();return}
  if(t.dataset.lgback){A.name=null;renderLogin();return}
  if(t.id==='startQuiz'){S.quiz=makeQuiz();if(!S.quiz.qs.length){S.quiz=null;toast('題目不夠，請先填寫上桌提醒')}render();return}
  if(t.id==='endQuiz'){S.quiz=null;render();return}
  if(t.dataset.opt!=null&&S.quiz){const Q=S.quiz;Q.picked=Number(t.dataset.opt);if(Q.qs[Q.i].o[Q.picked]===Q.qs[Q.i].a)Q.score++;render();return}
  if(t.id==='nextQ'){const Q=S.quiz;Q.i++;Q.picked=null;if(Q.i>=Q.qs.length)saveQuiz(Q);render();return}
  if(t.id==='tAdd'){TEAM_DRAFT.push({name:'',role:'partner'});render();return}
  if(t.dataset.tdel!=null){TEAM_DRAFT.splice(Number(t.dataset.tdel),1);render();return}

/* ---------- 連線 ---------- */
(function boot(){
  if(!window.firebase||!window.FIREBASE_CONFIG){ $('#main').innerHTML='<div class="notice">連不上資料庫，請確認網路後重新整理。</div>'; return; }
  firebase.initializeApp(window.FIREBASE_CONFIG); auth=firebase.auth(); fs=firebase.firestore();
  fs.doc('public/staff').onSnapshot(d=>{S.staff=d.exists?d.data():null;safeRender();attach()},()=>{});
  fs.doc('public/pwset').onSnapshot(d=>{S.pwset=d.exists?d.data():{}},()=>{});
  auth.onAuthStateChanged(u=>{S.user=u;S.authReady=true;S.quiz=null;watchCfg();attach();render()});
})();
/* 依角色掛上需要登入才能讀的資料 */
/* 名單只有登入後讀得到 */
let cfgUnsub=null,cfgUid='';
function watchCfg(){
  const uid=S.user?S.user.uid:'';
  if(uid===cfgUid) return; cfgUid=uid;
  if(cfgUnsub){cfgUnsub();cfgUnsub=null} S.cfg=null;
  if(!uid) return;
  cfgUnsub=fs.doc('drinkcfg/roles').onSnapshot(d=>{S.cfg=d.exists?d.data():{};attach();safeRender()},()=>{S.cfg={};attach();safeRender()});
}
let attachedKey='';
function attach(){
  const r=role(), key=(S.user?S.user.uid:'')+'|'+r+'|'+(S.cfg?1:0);
  if(key===attachedKey) return; attachedKey=key;
  subs.forEach(u=>u()); subs=[]; S.drinks={}; S.drinksLoaded=false; S.sop={}; S.quizAll={}; S.quizMine=null; S.pending={};
  if(!S.user||!S.cfg) return;
  if(r==='guest'){
    const n=nameOfMail(lc(S.user.email))||A.name||'', ref=fs.doc('drinkreq/'+S.user.uid);
    ref.get().then(d=>{ if(!d.exists&&n) return ref.set({name:n,at:new Date().toISOString()}); }).catch(()=>{});
    return;
  }
  subs.push(fs.collection('drinks').onSnapshot(s=>{S.drinks={};s.docs.forEach(d=>S.drinks[d.id]=d.data());S.drinksLoaded=true;safeRender()},()=>{S.drinksLoaded=true;safeRender()}));
  if(r==='boss') subs.push(fs.collection('drinkreq').onSnapshot(s=>{S.pending={};s.docs.forEach(d=>S.pending[d.id]=d.data());safeRender()},()=>{}));
  if(!seesSop()) return;
  subs.push(fs.collection('drinksop').onSnapshot(s=>{S.sop={};s.docs.forEach(d=>S.sop[d.id]=d.data());safeRender()},()=>{}));
  subs.push(fs.doc('drinkquiz/'+S.user.uid).onSnapshot(d=>{S.quizMine=d.exists?d.data():null;safeRender()},()=>{}));
  if(r==='boss'||r==='bar') subs.push(fs.collection('drinkquiz').onSnapshot(s=>{S.quizAll={};s.docs.forEach(d=>S.quizAll[d.id]=d.data());safeRender()},()=>{}));
}
