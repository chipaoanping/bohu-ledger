<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>伯虎飲品SOP手冊</title>
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#24414a">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="伯虎飲品">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: 與收支總覽同一套紙面、墨綠； 上方切換「上桌速查／吧台SOP／考核／人員」，下方是依菜單分類排列的品項清單 */
:root{
  --bg:#f3f4f1; --paper:#fcfcfa; --ink:#1b211e; --ink-2:#4f5a54; --ink-3:#86908a;
  --rule:#dde1dc; --soft:#ebeee9; --hover:#f0f2ee;
  --jade:#1f5e4a; --jade-soft:#e3efe9;
  --amber:#b8651a; --amber-soft:#fbf0e3; --amber-ink:#7a3f0c;
  --pos:#1f7a4d; --neg:#c23a3a; --focus:#2a78d6;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--jade);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0}
.who{font-size:13px;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.role{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--jade-soft);color:var(--jade);font-weight:700}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--paper);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:var(--jade-soft);font-weight:700}
.search{flex:1;min-width:160px;max-width:280px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 14px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--paper);font-weight:700}
.btn.danger{color:var(--neg)}
.hint{font-size:13px;color:var(--ink-3)}
.notice{background:var(--paper);border:1px dashed var(--rule);border-radius:12px;padding:18px;color:var(--ink-2);font-size:14px}

.cat{display:grid;gap:10px}
.cat-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.cat-h small{color:var(--ink-3);font-size:12px;letter-spacing:.1em}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.item{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.item-top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item-name{font-weight:700;font-size:16px}
.item-en{font-size:12.5px;color:var(--ink-3)}
.price{font-weight:700;color:var(--ink-2);white-space:nowrap}
.tags{display:flex;gap:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--ink-2);font-weight:700}
.desc{font-size:13.5px;color:var(--ink-2)}
.tip{background:var(--amber-soft);color:var(--amber-ink);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.55}
.tip b{display:block;font-size:11px;letter-spacing:.12em;color:var(--amber);margin-bottom:1px}
.tip.empty,.feat.empty,.tip.none{background:var(--soft);color:var(--ink-3)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.feat{background:var(--jade-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.55}
.feat b{display:block;font-size:11px;letter-spacing:.12em;color:var(--jade);margin-bottom:1px}
.feat.empty b,.tip.none b{color:var(--ink-3)}

/* SOP */
.sop{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.sop summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center}
.sop summary::-webkit-details-marker{display:none}
.sop summary .item-name{flex:1;min-width:0}
.sop[open] summary{border-bottom:1px solid var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex:none}
.dot.ok{background:var(--jade)}
.sop-body{padding:14px 16px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fact{background:var(--soft);border-radius:8px;padding:8px 10px}
.fact span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.fact b{font-weight:500}
.ing{width:100%;border-collapse:collapse;font-size:14px}
.ing td{border-bottom:1px solid var(--soft);padding:6px 4px}
.ing td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.steps{margin:0;padding-left:22px;display:grid;gap:4px}
.lbl{font-size:12px;color:var(--ink-3);letter-spacing:.1em;font-weight:700;margin-bottom:4px}

/* Quiz */
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:14px}
.q-prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--jade)}
.q-text{font-size:17px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt.right{border-color:var(--pos);background:var(--jade-soft)}
.opt.wrong{border-color:var(--neg)}
.big{font-family:var(--f-display);font-size:44px;font-weight:900;line-height:1}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--rule);padding:6px}
table.list td{border-bottom:1px solid var(--soft);padding:8px 6px}
.tbl{overflow-x:auto}

.qfb{border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:4px}
.qfb.ok{background:var(--jade-soft);color:var(--jade)}.qfb.no{background:var(--amber-soft);color:var(--amber-ink)}
.qcs{display:flex;flex-wrap:wrap;gap:6px}
.qc{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--jade-soft);color:var(--jade);white-space:nowrap;display:inline-block;margin:1px 2px}
.qc.bad{background:var(--amber-soft);color:var(--amber-ink)}
.qw{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.qa{color:var(--jade);font-weight:700}
.qscope{display:grid;gap:6px}
.qscope .chip small{font-size:11px;color:var(--ink-3)}
.qscope .chip:disabled{opacity:.45;cursor:not-allowed}
.qlist{list-style:none;margin:0;padding:10px 12px;background:var(--soft);border-radius:10px;display:grid;gap:6px;font-size:14px}
.qd{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;display:grid;gap:3px;font-size:13.5px;margin-bottom:6px;justify-items:start}
.ph2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;font-weight:700;line-height:1}
.pr-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pr-row{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:grid;gap:4px;background:var(--bg)}
.pr-main{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pr-who{font-size:13px;color:var(--ink-2)}
.pr-due{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.pr-due.soon{background:var(--amber-soft);color:var(--amber-ink)}.pr-due.late{background:var(--neg);color:#fff;font-weight:700}
.pr-ok{color:var(--pos);font-weight:700;font-size:13px}
.pr-g{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:700}
.pr-g.g1{background:var(--neg);color:#fff}.pr-g.g2{background:var(--amber-soft);color:var(--amber-ink)}.pr-g.g3{background:var(--jade-soft);color:var(--jade)}.pr-g.g4{background:var(--jade);color:var(--paper)}
.pr-ck{min-width:180px}.pr-ck span{display:inline-block;font-size:12px;color:var(--ink-3);margin:0 8px 2px 0;white-space:nowrap}.pr-ck span.on{color:var(--ink)}
.pr-tbl td{vertical-align:top}
.pr-bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--soft);vertical-align:middle;overflow:hidden}.pr-bar i{display:block;height:100%;background:var(--jade)}
.pr-bar.wide{width:100%;height:8px}
.pr-big{font-family:var(--f-display);font-size:36px;font-weight:900;line-height:1.1}.pr-big small{font-size:15px;color:var(--ink-3);font-family:var(--f-body);font-weight:500}
.pr-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.pr-checks label,.pr-grades label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)}
.pr-checks input,.pr-grades input{width:auto}
.pr-grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.pr-grades label{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;flex-wrap:wrap;cursor:pointer}
.pr-grades label small{flex-basis:100%;font-size:11.5px;color:var(--ink-3);padding-left:22px}
.pr-grades label:has(input:checked){border-color:var(--jade);background:var(--jade-soft)}
.pr-grades label.g1:has(input:checked),.pr-grades label.g2:has(input:checked){border-color:var(--amber);background:var(--amber-soft)}
/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,11,.5);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--paper);border-radius:14px;width:min(620px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.form textarea{min-height:76px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.mfoot .sp{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:50}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who-n{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.who-n i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-size:13px}
a.back{font-size:13px;color:var(--jade);text-decoration:none}
.lg{display:grid;gap:12px;justify-items:center;text-align:center}
.lg-names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lg-names button{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px}
.lg form{display:grid;gap:10px;width:min(300px,100%)}
.lg input{font-size:18px;letter-spacing:.15em;text-align:center;border:1px solid var(--rule);border-radius:12px;padding:10px;background:var(--bg)}
.lg-err{color:var(--neg);font-size:13px;margin:0;min-height:1em}
.linkbtn{border:0;background:none;color:var(--jade);cursor:pointer;font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">伯虎在二樓・飲品</div>
      <h1>飲品 SOP 手冊</h1>
    </div>
    <div class="top-r"><a class="back" href="./">← 收支總覽</a><span class="who" id="who"></span></div>
  </header>

  <div class="ctl">
    <div class="seg" role="group" aria-label="頁面" id="tabs">
      <button data-v="serve">上桌速查</button>
      <button data-v="sop" hidden>吧台SOP</button>
      <button data-v="quiz" hidden>考核</button>
      <button data-v="prac" hidden>練習紀錄</button>
      <button data-v="team" hidden>人員</button>
    </div>
  </div>

  <div class="ctl" id="filters">
    <div class="chips" id="cats"></div>
    <input class="search" id="q" type="search" placeholder="搜尋品名" aria-label="搜尋品名">
    <button class="btn pri" id="addBtn" hidden>＋ 新增品項</button>
  </div>

  <main id="main" style="display:grid;gap:22px"></main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
